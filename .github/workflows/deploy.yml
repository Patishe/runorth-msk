# Production moved to NIC.ru. Publication is performed separately over SSH.
# See https://github.com/Patishe/runorth/blob/main/DEPLOY-NIC.md
name: Validate Moscow site for NIC.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Moscow public site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate PHP sources
        run: find admin api partials -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate homepage PHP
        run: php -l index.php
      - name: Validate browser scripts
        run: |
          node --check app.js
          node --check quiz.js
